<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Category - CatThread</title>
    <link rel="icon" type="image/png" href="icons/cat.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f0f4f8; --container-bg: #ffffff; --text-color: #1a1a1a;
            --border-color: #b0c4de; --header-bg: #3a75c4; --sub-header: #4a90e2;
        }
        body.dark-mode {
            --bg-color: #181c24; --container-bg: #222831; --text-color: #f5f6f8;
            --border-color: #3f4e66; --header-bg: #2b6cb0; --sub-header: #3182ce;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: Tahoma, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background-color: var(--container-bg); border: 2px solid var(--border-color); padding: 15px; box-sizing: border-box; }
        header { background-color: var(--header-bg); color: white; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 20px; }
        a { color: #1e90ff; text-decoration: none; font-weight: bold; }
        .board-header { background-color: var(--sub-header); color: white; padding: 10px 12px; font-weight: bold; }
        .thread-item { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .new-thread-box { margin-top: 20px; padding: 15px; border: 1px solid var(--border-color); }
        input, textarea { padding: 8px; margin: 6px 0; width: 100%; box-sizing: border-box; background-color: var(--container-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        button { background-color: var(--header-bg); color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="category-title">Loading Folder...</h1>
            <a href="index.html" style="color:white;">Back to Home</a>
        </header>

        <div class="board-header">Threads in this Folder</div>
        <div id="threads-list"><div style="padding: 15px; color:#777;">Loading threads...</div></div>

        <div class="new-thread-box" id="new-thread-section" style="display:none;">
            <h3>Create New Thread</h3>
            <input type="text" id="thread-title" placeholder="Thread Title">
            <textarea id="thread-content" rows="4" placeholder="Initial post content..."></textarea>
            <button onclick="createThread()">Publish Thread</button>
        </div>
        <div id="login-prompt" style="margin-top: 15px; font-size: 13px; color: #777;">Log in on the home page to create a thread.</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://goqyxiucsxzjfdxbdekp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvcXl4aXVjc3h6amZkeGJkZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NTk2OTUsImV4cCI6MjEwMzAzNTY5NX0.3exRdGjsaOrPolFzYAlO-ytlfUHiTa9-SiodUFjtHIk';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if (localStorage.getItem('darkMode') === 'enabled') document.body.classList.add('dark-mode');

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('id');

        async function loadCategoryData() {
            const { data: cat } = await _supabase.from('categories').select('*').eq('id', categoryId).single();
            if (cat) document.getElementById('category-title').innerText = `Folder: ${cat.name}`;

            const { data: threads } = await _supabase.from('threads').select('*').eq('category_id', categoryId).order('created_at', { ascending: false });
            const list = document.getElementById('threads-list');
            
            if (!threads || threads.length === 0) {
                list.innerHTML = '<div style="padding: 15px; color:#777;">No threads in this folder yet. Be the first!</div>';
                return;
            }

            list.innerHTML = '';
            for (let t of threads) {
                let author = 'Anonymous';
                if (t.user_id) {
                    const { data: profile } = await _supabase.from('profiles').select('username').eq('id', t.user_id).maybeSingle();
                    if (profile && profile.username) author = profile.username;
                }

                list.innerHTML += `
                    <div class="thread-item">
                        <div>
                            <a href="thread.html?id=${t.id}">${t.title}</a>
                            <div style="font-size: 11px; color: #777; margin-top: 3px;">Started by ${author} on ${new Date(t.created_at).toLocaleString()}</div>
                        </div>
                    </div>
                `;
            }
        }

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('new-thread-section').style.display = 'block';
                document.getElementById('login-prompt').style.display = 'none';
            }
        }

        async function createThread() {
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();
            const { data: { session } } = await _supabase.auth.getSession();

            if (!session) {
                alert('You must be logged in to create a thread.');
                return;
            }

            if (!title || !content) { 
                alert('Please fill in both fields.'); 
                return; 
            }

            const { data, error } = await _supabase.from('threads').insert([{
                category_id: categoryId,
                title: title,
                content: content,
                user_id: session.user.id
            }]).select();

            if (error) {
                console.error('Error posting thread:', error);
                alert('Error: ' + error.message);
                return;
            }

            if (data && data.length > 0) {
                window.location.href = `thread.html?id=${data[0].id}`;
            } else {
                alert('Thread posted successfully!');
                window.location.reload();
            }
        }

        loadCategoryData();
        checkAuth();
    </script>
</body>
</html>
