<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CatThread - Category</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
:root {
            --bg-color: #eef2f5; 
            --container-bg: #ffffff; /* Solid white background */
            --text-color: #000; 
            --border-color: #ccc;
            --header-bg: #2b4c7e; 
            --sub-header: #3b5998; 
            --max-width: 900px;
        }
        body.dark-mode {
            --bg-color: #121212; 
            --container-bg: #1e1e1e; /* Solid dark background */
            --text-color: #e0e0e0; 
            --border-color: #444;
            --header-bg: #1a2a40; 
            --sub-header: #2c3e50;
        }
        body.wide-mode { --max-width: 100%; }

        body { background: var(--bg-color); color: var(--text-color); font-family: Tahoma, Arial, sans-serif; padding: 20px; margin: 0; }
        
        .container { max-width: var(--max-width); margin: 0 auto; background-color: var(--container-bg) !important; border: 1px solid var(--border-color); padding: 15px; box-sizing: border-box; }
        .create-box { margin-top: 20px; padding: 15px; border: 1px solid var(--border-color); background-color: var(--container-bg) !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="cat-title">Loading Category...</h1>
        </header>

        <a href="index.html" class="back-link">&larr; Back to Home</a>

        <div class="board-header">
            Threads in this Board
        </div>

        <div id="threads-list">
            <div style="padding: 15px; color: #666;">Loading threads...</div>
        </div>

        <!-- Create New Thread Form -->
        <div class="create-box">
            <h3 style="margin-top:0;">Create a New Thread</h3>
            <input type="text" id="thread-title" placeholder="Thread Title">
            <textarea id="thread-content" rows="4" placeholder="First post content..."></textarea>
            <button class="action-btn" onclick="createThread()">Post Thread</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://goqyxiucsxzjfdxbdekp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvcXl4aXVjc3h6amZkeGJkZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NTk2OTUsImV4cCI6MjEwMzAzNTY5NX0.3exRdGjsaOrPolFzYAlO-ytlfUHiTa9-SiodUFjtHIk';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if (localStorage.getItem('darkMode') === 'enabled') document.body.classList.add('dark-mode');
        if (localStorage.getItem('wideMode') === 'enabled') document.body.classList.add('wide-mode');

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('id');

        async function loadCategoryData() {
            if (!categoryId) return;

            const { data: category } = await _supabase.from('categories').select('*').eq('id', categoryId).single();
            if (category) document.getElementById('cat-title').innerText = '🐱 CatThread - ' + category.name;

            const container = document.getElementById('threads-list');
            const { data: threads } = await _supabase.from('threads').select('*').eq('category_id', categoryId);

            if (!threads || threads.length === 0) {
                container.innerHTML = `<div style="padding: 15px; color: #666;">No threads in this board yet. Create one below!</div>`;
                return;
            }

            container.innerHTML = '';
            threads.forEach(thread => {
                container.innerHTML += `
                    <div class="thread-item">
                        <a href="#">${thread.title}</a>
                        <p style="font-size: 11px; color: #666; margin: 4px 0 0 0;">Posted by ${thread.author_name || 'Anonymous'}</p>
                    </div>
                `;
            });
        }

        async function createThread() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                alert('You must be logged in to create a thread!');
                return;
            }

            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();

            if (!title || !content) {
                alert('Please fill out both a title and content!');
                return;
            }

            // Get user's unique username from profile table
            const { data: profile } = await _supabase.from('profiles').select('username').eq('id', session.user.id).single();
            const authorName = profile ? profile.username : 'User';

            // Insert thread
            const { data: newThread, error: threadError } = await _supabase
                .from('threads')
                .insert([{ category_id: categoryId, title, author_name: authorName }])
                .select()
                .single();

            if (threadError) {
                alert(threadError.message);
                return;
            }

            // Insert initial post inside the thread
            await _supabase.from('posts').insert([{ thread_id: newThread.id, content, author_name: authorName }]);

            alert('Thread created successfully!');
            location.reload();
        }

        loadCategoryData();
    </script>
</body>
</html>
