<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thread - CatThread</title>
    <link rel="icon" type="image/png" href="icons/cat.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@openmoji/openmoji-css@latest/font/openmoji.css">
    <style>
        :root {
            --bg-color: #f0f4f8; --container-bg: #ffffff; --text-color: #1a1a1a;
            --border-color: #b0c4de; --header-bg: #3a75c4; --sub-header: #4a90e2; --max-width: 900px;
        }
        body.dark-mode {
            --bg-color: #181c24; --container-bg: #222831; --text-color: #f5f6f8;
            --border-color: #3f4e66; --header-bg: #2b6cb0; --sub-header: #3182ce;
        }
        body.wide-mode { --max-width: 100%; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'OpenMoji', Tahoma, sans-serif; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: var(--max-width); margin: 0 auto; background-color: var(--container-bg); border: 2px solid var(--border-color); padding: 15px; box-sizing: border-box; }
        header { background-color: var(--header-bg); color: white; padding: 15px; margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
        h1 { margin: 0; font-size: 20px; }
        a { color: #1e90ff; text-decoration: none; font-weight: bold; }
        .board-header { background-color: var(--sub-header); color: white; padding: 10px 12px; font-weight: bold; }
        .post-box { padding: 15px; border-bottom: 1px solid var(--border-color); position: relative; }
        .comment-box { padding: 12px; border-bottom: 1px solid var(--border-color); position: relative; background: rgba(0,0,0,0.01); }
        body.dark-mode .comment-box { background: rgba(255,255,255,0.01); }
        .meta-info { font-size: 11px; color: #777; margin-bottom: 8px; }
        .reply-section { margin-top: 20px; padding: 15px; border: 1px solid var(--border-color); }
        textarea { padding: 8px; margin: 6px 0; width: 100%; box-sizing: border-box; background-color: var(--container-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        button { background-color: var(--header-bg); color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; }
        
        /* 3-Dots Menu Styles */
        .menu-container { position: absolute; top: 12px; right: 12px; }
        .dots-btn { background: none; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; padding: 0 5px; font-weight: bold; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 25px; background: var(--container-bg); border: 1px solid var(--border-color); box-shadow: 0 4px 8px rgba(0,0,0,0.15); z-index: 10; min-width: 100px; }
        .dropdown-menu button { display: block; width: 100%; text-align: left; background: none; color: var(--text-color); padding: 6px 10px; font-size: 12px; border: none; cursor: pointer; }
        .dropdown-menu button:hover { background-color: var(--sub-header); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="thread-title">Loading Thread...</h1>
            <a id="back-link" href="index.html" style="color:white;">Back</a>
        </header>

        <div id="main-post-container"></div>

        <div class="board-header">Comments & Replies</div>
        <div id="comments-list"><div style="padding: 15px; color:#777;">Loading comments...</div></div>

        <div class="reply-section" id="reply-section" style="display:none;">
            <h3>Post a Reply</h3>
            <textarea id="reply-content" rows="4" placeholder="Write your reply here..."></textarea>
            <button onclick="postReply()">Submit Reply</button>
        </div>
        <div id="login-prompt" style="margin-top: 15px; font-size: 13px; color: #777;">Log in on the home page to reply or manage your posts.</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://goqyxiucsxzjfdxbdekp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvcXl4aXVjc3h6amZkeGJkZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NTk2OTUsImV4cCI6MjEwMzAzNTY5NX0.3exRdGjsaOrPolFzYAlO-ytlfUHiTa9-SiodUFjtHIk';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if (localStorage.getItem('darkMode') === 'enabled') document.body.classList.add('dark-mode');
        if (localStorage.getItem('wideMode') === 'enabled') document.body.classList.add('wide-mode');

        const urlParams = new URLSearchParams(window.location.search);
        const threadId = urlParams.get('id');
        let currentUserId = null;

        // Converts normal text emojis into OpenMoji SVGs with fallback to sadcat/forum icon if unsupported
        function convertToOpenMoji(text) {
            if (!text) return '';
            return text.replace(/([\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA70}-\u{1FAFF}])/gu, function(match) {
                let hexCode = match.codePointAt(0).toString(16).toUpperCase();
                return `<img src="https://cdn.jsdelivr.net/npm/openmoji@latest/color/svg/${hexCode}.svg" alt="${match}" title="${match}" onerror="this.src='icons/cat.png'" style="width: 1.2em; height: 1.2em; vertical-align: -0.2em; display: inline-block;">`;
            });
        }

        function toggleMenu(event, menuId) {
            event.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => { if (m.id !== menuId) m.style.display = 'none'; });
            const menu = document.getElementById(menuId);
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        window.onclick = function() {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        }

        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUserId = session.user.id;
                document.getElementById('reply-section').style.display = 'block';
                document.getElementById('login-prompt').style.display = 'none';
            }
            loadThreadData();
        }

        async function loadThreadData() {
            const { data: thread, error } = await _supabase.from('threads').select('*').eq('id', threadId).single();
            if (error || !thread) {
                document.getElementById('main-post-container').innerHTML = '<div style="padding:15px; color:red;">Thread not found.</div>';
                return;
            }

            document.getElementById('back-link').href = `category.html?id=${thread.category_id}`;
            document.getElementById('thread-title').innerHTML = convertToOpenMoji(thread.title);

            let author = 'Anonymous';
            if (thread.user_id) {
                const { data: profile } = await _supabase.from('profiles').select('username').eq('id', thread.user_id).maybeSingle();
                if (profile && profile.username) author = profile.username;
            }

            let threadMenuHTML = '';
            if (currentUserId && thread.user_id === currentUserId) {
                threadMenuHTML = `
                    <div class="menu-container">
                        <button class="dots-btn" onclick="toggleMenu(event, 'thread-menu')">⋮</button>
                        <div id="thread-menu" class="dropdown-menu">
                            <button onclick="enableEditThread('${thread.id}', \`${encodeURIComponent(thread.title)}\`, \`${encodeURIComponent(thread.content)}\`)">Edit</button>
                            <button onclick="deleteThread('${thread.id}', '${thread.category_id}')">Delete</button>
                            <button onclick="archiveContent('${encodeURIComponent(thread.title)}', \`${encodeURIComponent(thread.content)}\`, '${author}', '${thread.created_at}', 'Thread')">Archive</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('main-post-container').innerHTML = `
                <div class="post-box" id="thread-box-${thread.id}">
                    ${threadMenuHTML}
                    <div class="meta-info">Started by <b>${author}</b> on ${new Date(thread.created_at).toLocaleString()}</div>
                    <div id="thread-content-text" style="white-space: pre-wrap; line-height: 1.5;">${convertToOpenMoji(thread.content)}</div>
                </div>
            `;

            loadComments();
        }

        async function loadComments() {
            const { data: comments } = await _supabase.from('comments').select('*').eq('thread_id', threadId).order('created_at', { ascending: true });
            const list = document.getElementById('comments-list');

            if (!comments || comments.length === 0) {
                list.innerHTML = '<div style="padding: 15px; color:#777;">No replies yet. Be the first to reply!</div>';
                return;
            }

            list.innerHTML = '';
            for (let c of comments) {
                let author = 'Anonymous';
                if (c.user_id) {
                    const { data: profile } = await _supabase.from('profiles').select('username').eq('id', c.user_id).maybeSingle();
                    if (profile && profile.username) author = profile.username;
                }

                let commentMenuHTML = '';
                if (currentUserId && c.user_id === currentUserId) {
                    commentMenuHTML = `
                        <div class="menu-container">
                            <button class="dots-btn" onclick="toggleMenu(event, 'comment-menu-${c.id}')">⋮</button>
                            <div id="comment-menu-${c.id}" class="dropdown-menu">
                                <button onclick="enableEditComment('${c.id}', \`${encodeURIComponent(c.content)}\`)">Edit</button>
                                <button onclick="deleteComment('${c.id}')">Delete</button>
                                <button onclick="archiveContent('', \`${encodeURIComponent(c.content)}\`, '${author}', '${c.created_at}', 'Comment')">Archive</button>
                            </div>
                        </div>
                    `;
                }

                list.innerHTML += `
                    <div class="comment-box" id="comment-box-${c.id}">
                        ${commentMenuHTML}
                        <div class="meta-info">Reply by <b>${author}</b> on ${new Date(c.created_at).toLocaleString()}</div>
                        <div id="comment-text-${c.id}" style="white-space: pre-wrap; line-height: 1.5;">${convertToOpenMoji(c.content)}</div>
                    </div>
                `;
            }
        }

        async function postReply() {
            const content = document.getElementById('reply-content').value.trim();
            if (!content) { alert('Reply cannot be empty.'); return; }
            
            const { error } = await _supabase.from('comments').insert([{
                thread_id: threadId,
                content: content,
                user_id: currentUserId
            }]);

            if (error) alert('Error: ' + error.message);
            else {
                document.getElementById('reply-content').value = '';
                loadComments();
            }
        }

        // Actions: Delete, Edit, Archive
        async function deleteThread(id, catId) {
            if (!confirm('Are you sure you want to delete this thread?')) return;
            const { error } = await _supabase.from('threads').delete().eq('id', id);
            if (error) alert('Error deleting thread: ' + error.message);
            else window.location.href = `category.html?id=${catId}`;
        }

        async function deleteComment(id) {
            if (!confirm('Are you sure you want to delete this comment?')) return;
            const { error } = await _supabase.from('comments').delete().eq('id', id);
            if (error) alert('Error deleting comment: ' + error.message);
            else loadComments();
        }

        function enableEditThread(id, encTitle, encContent) {
            const title = decodeURIComponent(encTitle);
            const content = decodeURIComponent(encContent);
            const box = document.getElementById(`thread-box-${id}`);
            box.innerHTML = `
                <h3>Edit Thread</h3>
                <input type="text" id="edit-thread-title" value="${title}">
                <textarea id="edit-thread-content" rows="5">${content}</textarea>
                <button onclick="saveEditThread('${id}')">Save</button>
                <button style="background:#777;" onclick="loadThreadData()">Cancel</button>
            `;
        }

        async function saveEditThread(id) {
            const newTitle = document.getElementById('edit-thread-title').value.trim();
            const newContent = document.getElementById('edit-thread-content').value.trim();
            if (!newTitle || !newContent) { alert('Fields cannot be empty'); return; }

            const { error } = await _supabase.from('threads').update({ title: newTitle, content: newContent }).eq('id', id);
            if (error) alert('Error updating thread: ' + error.message);
            else loadThreadData();
        }

        function enableEditComment(id, encContent) {
            const content = decodeURIComponent(encContent);
            const box = document.getElementById(`comment-box-${id}`);
            box.innerHTML = `
                <textarea id="edit-comment-content" rows="3">${content}</textarea>
                <button onclick="saveEditComment('${id}')">Save</button>
                <button style="background:#777;" onclick="loadComments()">Cancel</button>
            `;
        }

        async function saveEditComment(id) {
            const newContent = document.getElementById('edit-comment-content').value.trim();
            if (!newContent) { alert('Comment cannot be empty'); return; }

            const { error } = await _supabase.from('comments').update({ content: newContent }).eq('id', id);
            if (error) alert('Error updating comment: ' + error.message);
            else loadComments();
        }

        function archiveContent(encTitle, encContent, author, date, type) {
            const title = encTitle ? decodeURIComponent(encTitle) : '';
            const content = decodeURIComponent(encContent);
            
            const htmlContent = `<!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <title>Archived ${type} - CatThread</title>
                <style>body { font-family: Tahoma, sans-serif; padding: 20px; background: #f0f4f8; color: #1a1a1a; }</style>
            </head>
            <body>
                <div style="background: white; border: 2px solid #b0c4de; padding: 20px; max-width: 700px; margin: 0 auto;">
                    <h2>Archived ${type}: ${title || 'Reply'}</h2>
                    <p><strong>Author:</strong> ${author}</p>
                    <p><strong>Date Posted:</strong> ${new Date(date).toLocaleString()}</p>
                    <hr>
                    <div style="white-space: pre-wrap; line-height: 1.5;">${content}</div>
                </div>
            </body>
            </html>`;
            
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `catthread-${type.toLowerCase()}-archive.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        init();
    </script>
</body>
</html>
