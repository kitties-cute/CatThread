<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CatThread - 2016 Forums</title>
    <style>
        body { background-color: #eef2f5; font-family: Tahoma, Arial, sans-serif; margin: 0; color: #111; }
        header { background-color: #2b4c7e; color: white; padding: 15px 20px; border-bottom: 4px solid #1f355c; }
        .container { max-width: 900px; margin: 20px auto; background: white; border: 1px solid #ccc; padding: 15px; }
        .category-header { background-color: #3b5998; color: white; padding: 8px 12px; font-weight: bold; font-size: 14px; }
        .board { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #ddd; }
        .board a { color: #1a0dab; font-weight: bold; text-decoration: none; font-size: 16px; }
        .board a:hover { text-decoration: underline; }
        .desc { font-size: 12px; color: #666; margin: 4px 0 0 0; }
        .stats { text-align: right; font-size: 12px; color: #555; }
    </style>
</head>

    <header>
        <h1 style="margin:0; font-size: 24px;">🐱 CatThread</h1>
    </header>

    <div class="container">
        <div style="background: #f0f4f8; border: 1px solid #bcd; padding: 10px; margin-bottom: 15px; font-size: 13px;">
            📢 <b>Announcement:</b> Welcome to CatThread! The 2016 nostalgia trip begins now.
        </div>

        <div class="category-header">Main Category</div>
        <div class="board">
            <div>
                <a href="#">General Discussion</a>
                <p class="desc">Talk about anything under the sun.</p>
            </div>
            <div class="stats"><b>142</b> threads<br><b>1,205</b> posts</div>
        </div>
        <div class="board">
            <div>
                <a href="#">The Lounge / Off-Topic</a>
                <p class="desc">Memes, casual chat, and late-night thoughts.</p>
            </div>
            <div class="stats"><b>89</b> threads<br><b>3,410</b> posts</div>
        </div>
    </div>

</body>
</html>
